# gzip compression — fixes Semrush "uncompressed JS/CSS" warning (28 files)
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/javascript
  application/x-javascript
  application/json
  application/xml
  application/rss+xml
  application/atom+xml
  image/svg+xml;

# www -> non-www 301 redirect — fixes GSC "Duplicate without user-selected canonical"
# (matches when proxy forwards Host: www.alohawindowbros.com)
server {
  listen 80;
  server_name www.alohawindowbros.com;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  return 301 https://alohawindowbros.com$request_uri;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  # NOTE: no `index index.html;` here — the index directive triggers an internal
  # rewrite from / to /index.html, which then matches the `location = /index.html`
  # 301 rule below and causes an infinite redirect on the homepage.
  # try_files below handles directory→index.html resolution safely instead.

  # SSL terminates upstream, so nginx believes it is serving plain http and built
  # every one of the 301s below as `Location: http://alohawindowbros.com/...`
  # (verified live 2026-09-04 on /agoura.html and /sitemap.xml). That forced an extra
  # http -> https hop on every redirect. Relative Location headers keep the client on
  # the scheme it arrived with. Explicit `return 301 https://...` redirects (the
  # www block above) are unaffected.
  absolute_redirect off;

  # HSTS — fixes Semrush "subdomain doesn't support HSTS"
  # (SSL terminates upstream at the proxy; this header propagates to clients)
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;

  # 301 redirects: old WordPress blog URLs -> new /blog/ URLs
  location = /how-much-does-window-cleaning-cost-in-ventura-county/ { return 301 /blog/how-much-does-window-cleaning-cost-in-ventura-county/; }
  location = /professional-solar-panel-cleaning-vs-diy-cleaning/ { return 301 /blog/professional-solar-panel-cleaning-vs-diy-cleaning/; }
  location = /when-and-how-often-solar-panel-cleaning-should-be-done/ { return 301 /blog/when-and-how-often-solar-panel-cleaning-should-be-done/; }
  location = /window-cleaning-thousand-oaks-a-complete-guide-for-homeowners/ { return 301 /blog/window-cleaning-thousand-oaks-a-complete-guide-for-homeowners/; }
  location = /window-washing-ventura-county-why-professional-cleaning-makes-a-difference/ { return 301 /blog/window-washing-ventura-county-why-professional-cleaning-makes-a-difference/; }
  location = /window-cleaning-ventura-county-what-homeowners-should-know-before-hiring-professionals/ { return 301 /blog/window-cleaning-ventura-county-what-homeowners-should-know-before-hiring-professionals/; }

  # 301 redirects: old WordPress service pages -> new /services/ URLs
  location = /solar-panel-cleaning/ { return 301 /services/solar-panel-cleaning/; }
  location = /screen-cleaning/ { return 301 /services/screen-cleaning/; }
  location = /window-washing/ { return 301 /services/window-washing/; }

  # 301 redirects: old WordPress city .html pages -> new city landing pages
  location = /agoura.html { return 301 /agoura/; }
  location = /newbury.html { return 301 /newbury/; }
  location = /thousand-oaks.html { return 301 /thousand-oaks/; }
  location = /westlake.html { return 301 /westlake/; }

  # 301 redirects: legacy root URLs -> proper destinations
  location = /index { return 301 /; }
  location = /index.html { return 301 /; }
  location = /service { return 301 /#services; }
  location = /schedule { return 301 /; }
  location = /schedule/ { return 301 /; }

  # 301 redirect: stale sitemap submission -> current sitemap index
  location = /sitemap.xml { return 301 /sitemap-index.xml; }

  # Block old WordPress paths (no content to serve, return 410 Gone)
  location ^~ /wp-admin { return 410; }
  location /wp-login.php { return 410; }
  location ^~ /wp-content { return 410; }
  location ^~ /wp-includes { return 410; }
  location ^~ /wp-json { return 410; }
  location /xmlrpc.php { return 410; }
  location ~ ^/wp-.*\.php$ { return 410; }

  # Static asset caching
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  # Canonical trailing slash (added 2026-09-04).
  # `/blog/x` and `/blog/x/` both returned 200 with byte-identical HTML, because
  # try_files resolves `$uri/index.html` for the slashless form. Google indexed both
  # and ranked them DIFFERENTLY: the query x page join for 2026-08-05..09-01 put
  # "skylight cleaning" at position 14.4 on /blog/skylight-cleaning-service/ and 22.6
  # on /blog/skylight-cleaning-service, and "skylight cleaner" at 6.4 on the slashless
  # URL against 13.9 on the slash one. ~258 non-brand impressions sat on slashless
  # duplicates. rel=canonical and the sitemap already named the slash form; this is
  # the 301 that was missing. See SEO-LOG.md 2026-09-04.
  #
  # Both locations match ONLY paths without a trailing slash, so `/` can never match
  # and there is no `//` redirect loop. Anything that is not a directory (robots.txt,
  # sitemap-index.xml, the IndexNow key) fails the -d test and falls through to the
  # same try_files as before, so this cannot 404 a file that used to serve.
  # The wp-* blocks above are `^~` so they still win over these regex locations.
  location ~ ^/(?:blog|services)/[^/]+$ {
    if (-d $document_root$uri) { return 301 $uri/$is_args$args; }
    try_files $uri $uri/index.html =404;
  }
  location ~ ^/[^/.]+$ {
    if (-d $document_root$uri) { return 301 $uri/$is_args$args; }
    try_files $uri $uri/index.html =404;
  }

  # Astro static pages
  # Drop `$uri/` — with `index` removed, directories alone return 403; we always
  # want `$uri/index.html` to be tried instead. As a FILE check (no trailing slash)
  # it serves the file directly without re-evaluating locations, so the
  # `location = /index.html` redirect above won't fire on the internal lookup.
  location / {
    try_files $uri $uri/index.html =404;
  }
}
